name: Discover original 1914 Denmark-border map sources

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/discover_north_schleswig_1914_map_services.py
      - .github/workflows/north-schleswig-1914-map-services.yml
      - tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheets.json

permissions:
  contents: write

concurrency:
  group: north-schleswig-1914-map-catalog
  cancel-in-progress: false

jobs:
  discover-map-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query public SLUB historical map catalog, preserving failures
        run: python tools/discover_north_schleswig_1914_map_services.py
      - name: Require explicit absence of historic raster comparison
        run: |
          python - <<'PY'
          import json
          p="tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.slub-discovery.json"
          d=json.load(open(p))
          assert d['historicRasterObtained'] is False
          assert d['historicRasterComparedWithLine'] is False
          print(d['endpointObservations'])
          PY
      - name: Publish provenance report to GIS branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.slub-discovery.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "data(gis): record SLUB public map catalogue reachability"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
