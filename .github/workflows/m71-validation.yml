name: M7 offline corpus validation
on:
  push:
    branches: [codex/m7-world-rendering]
  pull_request:
    branches: [codex/integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-corpus:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify committed corpus offline
        run: |
          node --test tools/m71-corpus-verifier.test.mjs tools/m71-corpus-builder.test.mjs
          node tools/verify-m71-world-corpus.mjs tests/fixtures/world-rendering
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Fresh configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: M7.1 structural and diagnostic tests
        run: ctest --test-dir build -R 'world_corpus_tests|world_projection_diagnostics' --output-on-failure
      - name: Five diagnostic CPU baselines
        run: |
          for scenario in corpus-fit control-deu dateline polar mixed-content; do
            build/app/world_render_baseline --fixture tests/fixtures/world-rendering --scenario "$scenario" --json > "build/m71-${scenario}.json"
          done
      - name: Full available CTest suite
        run: |
          ctest --test-dir build --output-on-failure --output-junit build/results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/results.xml').getroot()
          skipped = [case.attrib.get('name', '') for case in root.iter('testcase') if case.find('skipped') is not None]
          print('CTest skipped:', ', '.join(skipped) if skipped else '(none)')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m71-corpus-results-${{ github.sha }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/m71-*.json
          retention-days: 7
