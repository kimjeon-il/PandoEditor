name: M975 fixture source recovery

on:
  push:
    branches: [codex/m97-web-editing-parity]
    paths:
      - .github/workflows/m975-fixture-recovery.yml
      - tools/m975-fixture-recovery/pack.py
      - tools/m975-fixture-recovery/inventory.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact application recovery code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: application
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/m975-fixture-recovery.yml
            /tools/m975-fixture-recovery/pack.py
            /tools/m975-fixture-recovery/inventory.json
      - name: Read pinned full hydro and historical sources
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/historical-library-pilot.json
            /assets/data/hydro/v0.13.0/manifest.json
            /assets/data/hydro/v0.13.0/index.bin.gz
            /assets/data/hydro/v0.13.0/metadata-core.json.gz
            /assets/data/hydro/v0.13.0/metadata-detail.json.gz
            /assets/data/hydro/v0.13.0/shards/s0.bin
            /assets/data/hydro/v0.13.0/shards/s1.bin
            /assets/data/hydro/v0.13.0/shards/s2.bin
            /assets/data/hydro/v0.13.1/manifest.json
            /assets/data/hydro/v0.13.1/metadata-core.json.gz
      - name: Read immutable original full-country source
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 53dbd3c1e84f04cf0332adc1b7a32f290b2a4f47
          path: river-country-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /assets/data/countries-ne-5.1.1.geojson
      - name: Validate source-only closure and split bounded chunks
        run: |
          python application/tools/m975-fixture-recovery/pack.py \
            --inventory application/tools/m975-fixture-recovery/inventory.json \
            --application-root application \
            --hydro-root full-hydro-web \
            --country-root river-country-web \
            --output "$RUNNER_TEMP/m975-fixture-source"
      - name: Upload authenticated source manifest
        uses: actions/upload-artifact@v4
        with:
          name: m975-fixture-source-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m975-fixture-source/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload source chunk 000
        uses: actions/upload-artifact@v4
        with:
          name: m975-fixture-source-000-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m975-fixture-source/part-000.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload source chunk 001
        uses: actions/upload-artifact@v4
        with:
          name: m975-fixture-source-001-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m975-fixture-source/part-001.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload source chunk 002
        uses: actions/upload-artifact@v4
        with:
          name: m975-fixture-source-002-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m975-fixture-source/part-002.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload source chunk 003
        uses: actions/upload-artifact@v4
        with:
          name: m975-fixture-source-003-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m975-fixture-source/part-003.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
