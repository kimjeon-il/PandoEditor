name: Stage 2 Hvidding 0718 east historical border review

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/verify_north_schleswig_1914_0718_east.py
      - .github/workflows/north-schleswig-1914-0718-east-stage2.yml

permissions:
  contents: write

concurrency:
  group: north-schleswig-0718-east-stage2
  cancel-in-progress: false

jobs:
  visual-and-screen-gis-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests shapely pyproj pillow
      - name: Render original Hvidding 1880 east panels and 0719 seam; verify source geometry
        env:
          GIS_EMIT_LOG_THUMBNAIL: "1"
        run: python tools/verify_north_schleswig_1914_0718_east.py
      - name: Enforce non-final reconstruction policy and shared-boundary continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("tools/historical-library/land-borders")
          p="german-denmark-1914-north-schleswig-001-026.0718-east-stage2"
          r=json.loads((root/(p+".json")).read_text())
          g=json.loads((root/(p+".geojson")).read_text())
          assert r["referenceDate"] == "1914-07-31"
          assert r["masterGeometryModified"] is False
          assert r["historicalBoundaryIndependentlyDigitized"] is False
          assert r["historicalScreenDeviationMeasured"] is False
          assert g["features"][0]["properties"]["doNotTreatAsFinal"] is True
          assert len(r["images"]) == 4
          t=r["candidate"]["topology"]
          assert abs(t["westHalfJoiningGapM"]) <= 0.01
          assert abs(t["eastJoiningGapTo0719M"]) <= 0.01
          assert abs(t["lengthPartitionErrorM"]) <= 0.01
          assert t["eastHalfSimple"] and t["combinedSeamSimple"]
          q=r["candidate"]["renderDisplayEstimate"]
          assert q["widthCssPx"] == 2560
          assert q["flatZoom"] == 64
          assert q["simplificationTargetCssPx"] == 0.5
          assert q["independentHistoricReferenceScreenDifferenceCssPx"] is None
          assert q["candidateVersusOwnSimplificationHausdorffCssPx"] <= 0.501
          assert len(r["images"][-1]["sourceWmsResponses"]) == 2
          print("PASS: Stage2 source topology + screen-scale proxy; historic deviation not measured.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: north-schleswig-0718-hvidding-east-stage2
          path: tools/historical-library/review-output/north-schleswig-1914-001-026/0718-east/
          if-no-files-found: error
          retention-days: 7
      - name: Commit only reversible clip and source diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0718-east-stage2.geojson \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0718-east-stage2.json
          if git diff --cached --quiet; then
            echo "Stage2 derived data unchanged"
          else
            git commit -m "data(gis): record 0718 east-stage2 candidate and screen-aware seam audit"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
