name: Visual review overlays for 1914 North Schleswig border 1-26

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/render_north_schleswig_1914_slub_overlays.py
      - .github/workflows/north-schleswig-1914-slub-overlays.yml

permissions:
  contents: write

concurrency:
  group: north-schleswig-1914-slub-overlays
  cancel-in-progress: false

jobs:
  render-pre1914-map-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests shapely pillow
      - name: Render four SLUB map fragments with the NON-FINAL parish-based candidate
        run: python tools/render_north_schleswig_1914_slub_overlays.py
      - name: Verify all map preview crops and preserve non-final status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.slub-overlays.json")
          d=json.loads(p.read_text())
          assert d["historicBorderValidated"] is False
          assert d["historicRasterStoredInGit"] is False
          assert len(d["sheetOverlays"]) == 4
          for r in d["sheetOverlays"]:
            print(r["sheetId"], r["status"])
            assert r["status"] == "preview-rendered-needs-human-review", r
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: north-schleswig-1914-sheets-1878-1880-overlays
          path: tools/historical-library/review-output/north-schleswig-1914-001-026/
          if-no-files-found: error
          retention-days: 7
      - name: Commit only source+preview metadata, not scanned map images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.slub-overlays.json
          if git diff --cached --quiet; then
            echo "Preview metadata unchanged."
          else
            git commit -m "data(gis): record temporary SLUB 1880 overlay review previews"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
