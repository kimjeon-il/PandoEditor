name: M2 validation
on:
  push:
    branches: [codex/m2-web-import]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Archive isolated SDK for local validation
        run: tar -czf "$RUNNER_TEMP/qt-sdk.tar.gz" -C "$QT_ROOT_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: m2-validation-sdk
          path: ${{ runner.temp }}/qt-sdk.tar.gz
          retention-days: 1
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-test-results-${{ github.sha }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/app/*.png
          retention-days: 7
