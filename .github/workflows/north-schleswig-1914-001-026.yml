name: Collect North Schleswig 1914 border sources

on:
  push:
    branches:
      - work/gis
    paths:
      - tools/collect_north_schleswig_1914_001_026.py
      - tools/build_north_schleswig_1914_001_026.py
      - .github/workflows/north-schleswig-1914-001-026.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests shapely pyproj
      - run: python tools/collect_north_schleswig_1914_001_026.py
      - run: python tools/build_north_schleswig_1914_001_026.py
      - name: Commit collected sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/sources/german-empire-1914/north-schleswig-001-026 tools/historical-library/land-borders
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: collect North Schleswig 1914 border sources 1-26"
            git push
          fi
