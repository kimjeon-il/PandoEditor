name: App offline stage3 0719 Spandet source contract

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0719-spandet-stage3.*
      - tools/verify_north_schleswig_1914_0719_spandet.py
      - .github/workflows/north-schleswig-1914-0719-spandet-stage3.yml

permissions:
  contents: read

jobs:
  parity-and-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Validate source-derived geometry, historical caveats and next sheet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pyproj import Transformer
          from shapely.geometry import Point, LineString, shape
          from shapely.ops import transform

          base=Path("tools/historical-library/land-borders")
          stem="german-denmark-1914-north-schleswig-001-026"
          def read(name): return json.loads((base/name).read_text(encoding="utf-8"))
          master=read(stem+".geojson")
          parts=read(stem+".sheet-segments.geojson")
          stage=read(stem+".0719-spandet-stage3.json")
          clipped=read(stem+".0719-spandet-stage3.geojson")
          scope=read(stem+".0719-spandet-stage3.scope-audit.json")
          to_m=Transformer.from_crs("EPSG:4326","EPSG:25832",always_xy=True).transform
          by={f["properties"]["sheetId"]:f for f in parts["features"]}
          assert {"0619","0718","0719"}.issubset(by)
          def geom(sheet): return transform(to_m,shape(by[sheet]["geometry"]))
          west,center,east=(geom(s) for s in ("0718","0719","0619"))
          candidate=transform(to_m,shape(clipped["features"][0]["geometry"]))
          assert candidate.geom_type=="LineString"
          assert candidate.is_simple
          assert candidate.hausdorff_distance(center)<0.01
          assert abs(candidate.length/1000-8.51496)<0.02
          assert Point(west.geoms[0].coords[-1]).distance(Point(candidate.coords[0]))<0.01
          assert Point(candidate.coords[-1]).distance(Point(east.geoms[0].coords[0]))<0.01
          assert master["features"][0]["properties"]["doNotTreatAsFinal"] is True
          assert clipped["features"][0]["properties"]["doNotTreatAsFinal"] is True
          assert stage["historicalCartographicReviewPerformed"] is False
          assert stage["geometrySourceModified"] is False
          assert stage["screenReviewPolicy"]["historicLineDisplacementPx"] is None
          assert stage["screenReviewPolicy"]["thresholdPassed"] is None
          assert len(stage["images"])==6
          assert stage["geometry"]["candidateVsOwnSimplification"]["candidateVersusOwnSimplificationHausdorffCssPx"]<=0.5
          assert stage["geometry"]["startMatches0718DistanceM"]<=0.01
          assert stage["geometry"]["endMatches0619DistanceM"]<=0.01
          assert scope["status"].startswith("scope-error-confirmed")
          assert scope["currentMaster"]["hasExtendedBeyondStone26"] is True
          assert scope["provisionalContemporaryBridgeControl"]["cannotDefineExactStone26Cut"] is True
          assert scope["provisionalContemporaryBridgeControl"]["approximatedWorkingLineKmBeyondBridge"]>5
          assert Path("tools/historical-library/land-borders/"+stem+".0719-spandet-stage3.review.md").exists()
          print("PASS: offline 0719 geometry/continuity/screen proxy and stone26 scope warning; historic line is not certified.")
          PY
