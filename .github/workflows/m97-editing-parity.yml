name: M9.7 editing parity validation
on:
  push:
    branches: [codex/m97-web-editing-parity]
    # Temporary source-only recovery filter; remove before next product checkpoint.
    paths-ignore: ['.github/workflows/m975-source-recovery.yml', '.github/workflows/m97-editing-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify declaration-only pinned D3 adapter
        run: |
          mkdir -p evidence
          npm ci --prefix tools/m97/river/d3-adapter --ignore-scripts --registry=https://registry.npmjs.org
          node --test tools/m97/river/generate-d3-adapter.test.mjs | tee evidence/d3-adapter-tests.txt
          node tools/m97/river/generate-d3-adapter.mjs --check | tee evidence/d3-adapter-regeneration.json
      - name: Verify offline pinned production oracle and comparator
        run: |
          mkdir -p evidence
          mapfile -t oracle_tests < <(find tools/m97 -maxdepth 1 -name '*.test.mjs' ! -name 'native-selection.test.mjs' ! -name 'split-differential-native.test.mjs' | sort)
          node --test "${oracle_tests[@]}" | tee evidence/node-tests.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - name: Build native production and regression probes
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: Verify actual compiled split controller probe
        env:
          PANDO_M973_SPLIT_PROBE: ${{ github.workspace }}/build/app/m973_split_controller_probe
        run: node --test tools/m97/split-differential-native.test.mjs | tee evidence/split-native-probe-tests.txt
      - name: Preserve exact compiled split probes
        run: |
          mkdir -p evidence/split-runtime
          df -h .
          ln build/app/m973_split_controller_probe build/app/m973_cut_kernel_probe evidence/split-runtime/
          printf '%s\n' "$GITHUB_SHA" > evidence/split-runtime/COMMIT
          (cd evidence/split-runtime && sha256sum m973_split_controller_probe m973_cut_kernel_probe > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m973-split-runtime-${{ github.sha }}
          path: evidence/split-runtime
          retention-days: 14
      - name: Preserve exact compiled M9.7.4 probes
        run: |
          mkdir -p evidence/m974-runtime
          df -h .
          ln build/app/m974_snap_probe build/app/m974_snap_provider_probe build/app/m974_boundary_probe build/app/m974_snap_order_tests evidence/m974-runtime/
          printf '%s\n' "$GITHUB_SHA" > evidence/m974-runtime/COMMIT
          (cd evidence/m974-runtime && sha256sum m974_snap_probe m974_snap_provider_probe m974_boundary_probe m974_snap_order_tests > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m974-runtime-${{ github.sha }}
          path: evidence/m974-runtime
          retention-days: 14
      - name: Fetch pinned full regression datasets
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/historical-library-pilot.json
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
      - name: Fetch immutable original full-country validation context
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 53dbd3c1e84f04cf0332adc1b7a32f290b2a4f47
          path: river-country-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /assets/data/countries-ne-5.1.1.geojson
      - name: Full native regression with skip audit
        env:
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
          PANDOEDITOR_HISTORICAL_FULL_PILOT: ${{ github.workspace }}/full-hydro-web/assets/data/historical-library-pilot.json
          PANDOEDITOR_RIVER_EVIDENCE: ${{ github.workspace }}/evidence/river-native
        run: |
          ctest --test-dir build --output-on-failure --output-junit results.xml
          python tools/m6-regression-audit.py build/results.xml build/Testing/Temporary/LastTest.log
      - name: Capture 42 compiled-native observations for direct browser comparison
        env:
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
          PANDOEDITOR_RIVER_COUNTRIES: ${{ github.workspace }}/river-country-web/assets/data/countries-ne-5.1.1.geojson
        run: node --max-old-space-size=512 tools/m97/river/collect-native.mjs --native build/app/m972_river_probe --reuse evidence/river-native --output evidence/river-direct
      - uses: actions/upload-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: evidence/river-direct
          retention-days: 14
      - name: Preserve exact compiled controller probe for browser follow-on
        run: |
          mkdir -p evidence/river-controller-runtime
          df -h .
          ln build/app/m972_river_controller_probe evidence/river-controller-runtime/
          printf '%s\n' "$GITHUB_SHA" > evidence/river-controller-runtime/COMMIT
          (cd evidence/river-controller-runtime && sha256sum m972_river_controller_probe > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m972-river-controller-runtime-${{ github.sha }}
          path: evidence/river-controller-runtime
          retention-days: 14
      - name: Record real native calculation differences (not a parity pass)
        if: always()
        run: node tools/m97/native-baseline.mjs build/app/m4_geometry_probe evidence/native-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m971-evidence-${{ github.sha }}
          path: |
            evidence
            build/results.xml
            build/Testing/Temporary/LastTest.log
          retention-days: 14

  river-chromium-oracle:
    needs: linux-regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: native-river-artifact
      - name: Verify immutable sources and generated adapters
        run: python3 tools/m97/river/generate-adapters.py --check
      - name: Install pinned official Playwright and Chromium
        run: |
          npm ci --prefix tools/m97/river/browser --ignore-scripts --registry=https://registry.npmjs.org
          node tools/m97/river/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Compare 42 native outputs and capture the actual Chromium controller workflow
        run: node --max-old-space-size=512 tools/m97/river/browser/run.mjs native-river-artifact evidence/river-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m972-river-chromium-${{ github.sha }}
          path: evidence/river-chromium
          retention-days: 14

  river-controller-parity:
    needs: [linux-regression, river-chromium-oracle]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case-id: serbia-annex
            case-name: Serbia-to-Hungary-controller-entry-chain
            timeout-seconds: 300
          - case-id: moldova-annex
            case-name: Moldova-to-Romania-controller-entry-chain
            timeout-seconds: 300
          - case-id: serbia-middle-removal
            case-name: Serbia-to-Hungary-controller-archive-residual-middle-removal
            timeout-seconds: 360
          - case-id: serbia-last-removal
            case-name: Serbia-to-Hungary-controller-archive-residual-last-removal
            timeout-seconds: 360
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-controller-runtime-${{ github.sha }}
          path: controller-runtime
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: native-river-artifact
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-chromium-${{ github.sha }}
          path: browser-river-artifact
      - name: Fetch identical full river source
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
      - name: Verify exact compiled artifact and actual browser controller parity
        env:
          PANDO_CONTROLLER_CASE: ${{ matrix.case-name }}
          PANDO_CONTROLLER_TIMEOUT: ${{ matrix.timeout-seconds }}
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
        run: |
          test "$(cat controller-runtime/COMMIT)" = "$GITHUB_SHA"
          (cd controller-runtime && sha256sum -c SHA256SUMS)
          test "$(qmake -query QT_VERSION)" = '6.8.3'
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          chmod +x controller-runtime/m972_river_controller_probe
          mkdir -p evidence/river-controller
          timeout "$PANDO_CONTROLLER_TIMEOUT" controller-runtime/m972_river_controller_probe --browser-annex browser-river-artifact/browser-report.json native-river-artifact/payload.json evidence/river-controller/controller-report.json --case "$PANDO_CONTROLLER_CASE" 2> evidence/river-controller/controller-stderr.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m972-river-controller-${{ matrix.case-id }}-${{ github.sha }}
          path: evidence/river-controller
          retention-days: 14

  split-chromium-oracle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned official Playwright and Chromium
        run: |
          npm ci --prefix tools/m97/river/browser --ignore-scripts --registry=https://registry.npmjs.org
          node tools/m97/river/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Capture actual split lifecycle and bounded flat-globe kernel corpus
        run: node --max-old-space-size=512 tools/m97/split-browser-runner.mjs evidence/split-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m973-split-chromium-${{ github.sha }}
          path: evidence/split-chromium
          retention-days: 14

  split-controller-parity:
    needs: [linux-regression, split-chromium-oracle]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install matching native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: m973-split-runtime-${{ github.sha }}
          path: split-runtime
      - uses: actions/download-artifact@v4
        with:
          name: m973-split-chromium-${{ github.sha }}
          path: browser-split-artifact
      - name: Compare actual compiled observations against actual Chromium
        run: |
          test "$(cat split-runtime/COMMIT)" = "$GITHUB_SHA"
          (cd split-runtime && sha256sum -c SHA256SUMS)
          test "$(qmake -query QT_VERSION)" = '6.8.3'
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          chmod +x split-runtime/m973_split_controller_probe split-runtime/m973_cut_kernel_probe
          node --max-old-space-size=512 tools/m97/split-differential-runner.mjs browser-split-artifact split-runtime evidence/split-differential
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m973-split-differential-${{ github.sha }}
          path: evidence/split-differential
          retention-days: 14

  snap-boundary-parity:
    needs: linux-regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install matching native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: m974-runtime-${{ github.sha }}
          path: m974-runtime
      - name: Verify exact native runtime and comparator contracts
        run: |
          test "$(cat m974-runtime/COMMIT)" = "$GITHUB_SHA"
          (cd m974-runtime && sha256sum -c SHA256SUMS)
          test "$(qmake -query QT_VERSION)" = '6.8.3'
          chmod +x m974-runtime/m974_snap_probe m974-runtime/m974_snap_provider_probe m974-runtime/m974_boundary_probe m974-runtime/m974_snap_order_tests
          node --test tools/m974-native-*.test.mjs tools/m974-snap-boundary/*.test.mjs
      - name: Install pinned official browser runtime
        run: |
          npm ci --prefix tools/m97/river/browser --ignore-scripts --registry=https://registry.npmjs.org
          node tools/m97/river/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Capture same-commit actual Chromium workflows and thresholds
        run: |
          node --max-old-space-size=512 tools/m974-snap-boundary/browser-runner.mjs evidence/snap-boundary-chromium
          node --max-old-space-size=512 tools/m974-snap-boundary/supplemental-browser-runner.mjs evidence/supplemental-chromium
          node --max-old-space-size=512 tools/m974-snap-boundary/source-order-v2-browser-runner.mjs evidence/source-order-chromium
          node --max-old-space-size=512 tools/m974-snap-boundary/source-history-browser-runner.mjs evidence/source-history-chromium
      - name: Compare native snap against actual Chromium
        run: |
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          node --max-old-space-size=512 tools/m974-native-snap.mjs \
            --browser-report evidence/snap-boundary-chromium/browser-report.json \
            --suite evidence/snap-boundary-chromium/suite.json.gz \
            --suite-pin evidence/snap-boundary-chromium/suite-pin.json \
            --report-transfer evidence/snap-boundary-chromium/report-transfer.json \
            --probe-input evidence/snap-boundary-chromium/snap-probe-input.jsonl \
            --math evidence/snap-boundary-chromium/math-diagnostics.json \
            --helper-probe "$PWD/m974-runtime/m974_snap_probe" \
            --provider-probe "$PWD/m974-runtime/m974_snap_provider_probe" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output evidence/native-snap
      - name: Compare native boundary workflows against actual Chromium
        run: |
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          mkdir -p evidence/native-boundary
          m974-runtime/m974_boundary_probe < tests/fixtures/web-m974/boundary-cases.json > evidence/native-boundary/observations.json
          python tests/m974_boundary_delivery_tests.py --observations evidence/native-boundary/observations.json
          node tools/m974-native-boundary.mjs \
            --browser-directory evidence/snap-boundary-chromium \
            --native-file evidence/native-boundary/observations.json \
            --output-file evidence/native-boundary/comparison.json \
            --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" \
            --native-commit "$(cat m974-runtime/COMMIT)" \
            --native-binary-sha256 "$(sha256sum m974-runtime/m974_boundary_probe | cut -d ' ' -f 1)"
      - name: Compare native threshold helpers against actual Chromium
        run: |
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          node tools/m974-native-supplemental.mjs \
            --browser-directory evidence/supplemental-chromium \
            --native-probe "$PWD/m974-runtime/m974_boundary_probe" \
            --output evidence/native-supplemental \
            --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"
      - name: Compare source insertion order across declared stimulus layers
        run: |
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          node tools/m974-native-source-order.mjs \
            --browser-directory evidence/source-order-chromium \
            --native-probe "$PWD/m974-runtime/m974_snap_order_tests" \
            --output evidence/native-source-order \
            --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"
      - name: Compare mapped source-history workflows against actual Chromium
        run: |
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          node tools/m974-native-source-history.mjs \
            --browser-directory evidence/source-history-chromium \
            --native-probe "$PWD/m974-runtime/m974_snap_order_tests" \
            --output evidence/native-source-history \
            --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m974-differential-${{ github.sha }}
          path: evidence
          retention-days: 14
