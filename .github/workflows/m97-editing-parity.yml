name: M9.7 editing parity validation
on:
  push:
    branches: [codex/m97-web-editing-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify declaration-only pinned D3 adapter
        run: |
          mkdir -p evidence
          npm ci --prefix tools/m97/river/d3-adapter --ignore-scripts --registry=https://registry.npmjs.org
          node --test tools/m97/river/generate-d3-adapter.test.mjs | tee evidence/d3-adapter-tests.txt
          node tools/m97/river/generate-d3-adapter.mjs --check | tee evidence/d3-adapter-regeneration.json
      - name: Verify offline pinned production oracle and comparator
        run: |
          mkdir -p evidence
          mapfile -t oracle_tests < <(find tools/m97 -maxdepth 1 -name '*.test.mjs' ! -name 'native-selection.test.mjs' | sort)
          node --test "${oracle_tests[@]}" | tee evidence/node-tests.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - name: Build native production and regression probes
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: Fetch pinned full regression datasets
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-web
          persist-credentials: false
          sparse-checkout: |
            assets/data/historical-library-pilot.json
            assets/data/hydro/v0.13.0
            assets/data/hydro/v0.13.1
      - name: Fetch immutable original full-country validation context
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 53dbd3c1e84f04cf0332adc1b7a32f290b2a4f47
          path: river-country-web
          persist-credentials: false
          sparse-checkout: assets/data/countries-ne-5.1.1.geojson
      - name: Full native regression with skip audit
        env:
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
          PANDOEDITOR_HISTORICAL_FULL_PILOT: ${{ github.workspace }}/full-hydro-web/assets/data/historical-library-pilot.json
          PANDOEDITOR_RIVER_EVIDENCE: ${{ github.workspace }}/evidence/river-native
        run: |
          ctest --test-dir build --output-on-failure --output-junit results.xml
          python tools/m6-regression-audit.py build/results.xml build/Testing/Temporary/LastTest.log
      - name: Capture 42 compiled-native observations for direct browser comparison
        env:
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
          PANDOEDITOR_RIVER_COUNTRIES: ${{ github.workspace }}/river-country-web/assets/data/countries-ne-5.1.1.geojson
        run: node --max-old-space-size=512 tools/m97/river/collect-native.mjs --native build/app/m972_river_probe --reuse evidence/river-native --output evidence/river-direct
      - uses: actions/upload-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: evidence/river-direct
          retention-days: 14
      - name: Preserve exact compiled controller probe for browser follow-on
        run: |
          mkdir -p evidence/river-controller-runtime
          cp build/app/m972_river_controller_probe evidence/river-controller-runtime/
          printf '%s\n' "$GITHUB_SHA" > evidence/river-controller-runtime/COMMIT
          (cd evidence/river-controller-runtime && sha256sum m972_river_controller_probe > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m972-river-controller-runtime-${{ github.sha }}
          path: evidence/river-controller-runtime
          retention-days: 14
      - name: Record real native calculation differences (not a parity pass)
        if: always()
        run: node tools/m97/native-baseline.mjs build/app/m4_geometry_probe evidence/native-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m971-evidence-${{ github.sha }}
          path: |
            evidence
            build/results.xml
            build/Testing/Temporary/LastTest.log
          retention-days: 14

  river-chromium-oracle:
    needs: linux-regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: native-river-artifact
      - name: Verify immutable sources and generated adapters
        run: python3 tools/m97/river/generate-adapters.py --check
      - name: Install pinned official Playwright and Chromium
        run: |
          npm ci --prefix tools/m97/river/browser --ignore-scripts --registry=https://registry.npmjs.org
          node tools/m97/river/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Compare 42 native outputs and capture the actual Chromium controller workflow
        run: node --max-old-space-size=512 tools/m97/river/browser/run.mjs native-river-artifact evidence/river-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m972-river-chromium-${{ github.sha }}
          path: evidence/river-chromium
          retention-days: 14

  river-controller-parity:
    needs: [linux-regression, river-chromium-oracle]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case-id: serbia-annex
            case-name: Serbia-to-Hungary-controller-entry-chain
            timeout-seconds: 300
          - case-id: moldova-annex
            case-name: Moldova-to-Romania-controller-entry-chain
            timeout-seconds: 300
          - case-id: serbia-middle-removal
            case-name: Serbia-to-Hungary-controller-archive-residual-middle-removal
            timeout-seconds: 360
          - case-id: serbia-last-removal
            case-name: Serbia-to-Hungary-controller-archive-residual-last-removal
            timeout-seconds: 360
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-controller-runtime-${{ github.sha }}
          path: controller-runtime
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-native-${{ github.sha }}
          path: native-river-artifact
      - uses: actions/download-artifact@v4
        with:
          name: m972-river-chromium-${{ github.sha }}
          path: browser-river-artifact
      - name: Fetch identical full river source
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-web
          persist-credentials: false
          sparse-checkout: |
            assets/data/hydro/v0.13.0
            assets/data/hydro/v0.13.1
      - name: Verify exact compiled artifact and actual browser controller parity
        env:
          PANDO_CONTROLLER_CASE: ${{ matrix.case-name }}
          PANDO_CONTROLLER_TIMEOUT: ${{ matrix.timeout-seconds }}
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ github.workspace }}/full-hydro-web/assets/data/hydro/v0.13.1/manifest.json
        run: |
          test "$(cat controller-runtime/COMMIT)" = "$GITHUB_SHA"
          (cd controller-runtime && sha256sum -c SHA256SUMS)
          test "$(qmake -query QT_VERSION)" = '6.8.3'
          export LD_LIBRARY_PATH="$(qmake -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          chmod +x controller-runtime/m972_river_controller_probe
          mkdir -p evidence/river-controller
          timeout "$PANDO_CONTROLLER_TIMEOUT" controller-runtime/m972_river_controller_probe --browser-annex browser-river-artifact/browser-report.json native-river-artifact/payload.json evidence/river-controller/controller-report.json --case "$PANDO_CONTROLLER_CASE" 2> evidence/river-controller/controller-stderr.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m972-river-controller-${{ matrix.case-id }}-${{ github.sha }}
          path: evidence/river-controller
          retention-days: 14
