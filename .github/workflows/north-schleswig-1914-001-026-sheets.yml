name: Audit North Schleswig 1914 historical map sheet coverage

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/audit_north_schleswig_1914_001_026_sheets.py
      - .github/workflows/north-schleswig-1914-001-026-sheets.yml
      - tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.geojson

permissions:
  contents: write

concurrency:
  group: north-schleswig-1914-sheets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sheet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Exact candidate intersections with historical sheet grid
        run: python tools/audit_north_schleswig_1914_001_026_sheets.py
      - name: Validate report remains provisional
        run: |
          python - <<'PY'
          import json, pathlib
          f=pathlib.Path("tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheets.json")
          r=json.loads(f.read_text())
          assert r["historicalRasterComparisonPerformed"] is False
          assert abs(r["sheetCoverageDifferenceM"]) <= 2
          assert r["anyUnavailablePre1914Edition"], "Unexpected: all relevant sheets now eligible; recheck dates"
          print("Candidate remains non-final; raster verification still pending.")
          PY
      - name: Commit derived sheet index (not source raster)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheets.json \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheets.geojson \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheet-segments.geojson
          if git diff --cached --quiet; then
            echo "Sheet index unchanged."
          else
            git commit -m "data(gis): index exact pre-1914 map sheet intersections for stones 1-26"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
