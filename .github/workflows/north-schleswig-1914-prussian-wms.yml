name: Check Prussian historical-map WMS coverage 1914 Denmark border

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/probe_north_schleswig_1914_prussian_wms.py
      - .github/workflows/north-schleswig-1914-prussian-wms.yml

permissions:
  contents: write

concurrency:
  group: north-schleswig-prussian-wms
  cancel-in-progress: false

jobs:
  probe-service-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read public WMS geographic coverage and rights
        run: python tools/probe_north_schleswig_1914_prussian_wms.py
      - name: Require service probe remains non-final
        run: |
          python - <<'PY'
          import json
          p="tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.wms-services.json"
          d=json.load(open(p))
          assert d["candidateHistoricBorderVerified"] is False
          assert d["rasterDownloaded"] is False
          print("Service metadata checked; no historical raster comparison.")
          PY
      - name: Commit only small public service metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.wms-services.json
          if git diff --cached --quiet; then
            echo "WMS report unchanged."
          else
            git commit -m "data(gis): record public 1880 map WMS coverage for 1-26"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
