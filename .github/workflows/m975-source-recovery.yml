name: Temporary pinned source recovery
on:
  push:
    branches: [codex/m97-web-editing-parity]
    paths: ['.github/workflows/m975-source-recovery.yml']
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdf5f979e262b6dd61e705c233f562a27264c6c1
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned tracked source and create bounded data chunks
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          base='bdf5f979e262b6dd61e705c233f562a27264c6c1'
          tree='804f51ce4165bdb7b97bbb574607cd1c47183503'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==tree
          entries=[]
          for raw in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0'):
              if not raw: continue
              info,name=raw.split(b'\t',1);mode,kind,sha=info.decode().split();name=name.decode()
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert kind=='blob' and mode in ('100644','100755'),(name,mode,kind)
              assert not any(x in p.parts for x in ('.aws','.ssh','.env'))
              entries.append({'path':name,'mode':mode,'sha':sha})
          assert len(entries)==1405
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pando-source-recovery';out.mkdir()
          archive=out/'source.tar'
          subprocess.run(['git','archive','--format=tar','-o',str(archive),base],check=True)
          chunks=[]
          with archive.open('rb') as f:
              while data:=f.read(8*1024*1024):
                  name=f'source.part-{len(chunks):02d}';(out/name).write_bytes(data)
                  chunks.append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert 1<=len(chunks)<=8
          manifest={'schema':'pando-source-recovery','version':1,'base':base,'tree':tree,'workflowCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'sourceOnly':True,'files':entries,'chunks':chunks,'archiveBytes':archive.stat().st_size,'archiveSha256':hashlib.sha256(archive.read_bytes()).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('count='+str(len(chunks))+'\n')
          print(json.dumps({'base':base,'tree':tree,'trackedFiles':len(entries),'chunks':len(chunks),'archiveBytes':archive.stat().st_size}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m975-source-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/manifest.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 0 }}
        with:
          name: m975-source-part-00-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-00
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 1 }}
        with:
          name: m975-source-part-01-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-01
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 2 }}
        with:
          name: m975-source-part-02-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-02
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 3 }}
        with:
          name: m975-source-part-03-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-03
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 4 }}
        with:
          name: m975-source-part-04-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-04
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 5 }}
        with:
          name: m975-source-part-05-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-05
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 6 }}
        with:
          name: m975-source-part-06-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-06
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.source.outputs.count) > 7 }}
        with:
          name: m975-source-part-07-${{ github.sha }}
          path: ${{ runner.temp }}/pando-source-recovery/source.part-07
          retention-days: 14
          if-no-files-found: error
