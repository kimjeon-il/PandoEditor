name: Stage 1 review Hvidding 0718 west original

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/verify_north_schleswig_1914_0718_west.py
      - .github/workflows/north-schleswig-1914-0718-west-stage1.yml
      - tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheet-segments.geojson

permissions:
  contents: write

concurrency:
  group: north-schleswig-stage1-0718-west
  cancel-in-progress: false

jobs:
  original-0718-west:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical GIS and raster dependencies
        run: python -m pip install --disable-pip-version-check shapely pyproj requests pillow
      - name: Produce west-half 1880 map and UNVERIFIED candidate overlays
        env:
          GIS_EMIT_LOG_THUMBNAIL: '1'
        run: python tools/verify_north_schleswig_1914_0718_west.py
      - name: Enforce segment and non-final consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('tools/historical-library/land-borders')
          f='german-denmark-1914-north-schleswig-001-026.0718-west-stage1'
          r=json.loads((b/(f+'.json')).read_text())
          g=json.loads((b/(f+'.geojson')).read_text())
          assert r['originalRasterAccessible'] is True
          assert r['independentHistoricBoundaryDigitizationCompleted'] is False
          assert r['candidateGeometryModified'] is False
          assert r['historicBorderDisplacementMeasured'] is False
          assert g['features'][0]['properties']['doNotTreatAsFinal'] is True
          assert abs(r['candidate']['entireSheetLengthKm']-11.88108)<0.04
          assert abs(r['candidate']['westernHalfLengthKm']-5.94054)<0.04
          assert len(r['rasterPanels']) == 3
          assert all(p['map']['imageDimensions'][0] >= 1700 for p in r['rasterPanels'])
          print('Stage1 checks OK. Historic border line NOT yet independently traced.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: north-schleswig-0718-hvidding-west-half-stage1
          path: tools/historical-library/review-output/north-schleswig-1914-001-026/0718-west/
          if-no-files-found: error
          retention-days: 7
      - name: Commit clipping and measurements, not historical raster data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0718-west-stage1.geojson             tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0718-west-stage1.json
          if git diff --cached --quiet; then
            echo "No stage 1 changes."
          else
            git commit -m "data(gis): preserve stage-1 Hvidding western half original map visual audit"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
