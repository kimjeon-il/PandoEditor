name: M2 exact-tree validation and delivery
on:
  push:
    branches: [codex/m2-web-import]
    paths: ['.github/workflows/m2-delivery.yml', '.github/m2-transfer-*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver-tested-tree:
    if: github.repository == 'kimjeon-il/PandoEditor' && github.ref == 'refs/heads/codex/m2-web-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
      EXPECTED_TREE: a0ac3a2c69af35adb56b2829d3fd98fd77885340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact transfer and stage isolated source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/m2-web-import
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/m2-transfer-{i}.b64').read_text().strip() for i in (1, 2, 3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'de1d87da1505d7c3ffe79656f8b8e8f17e1a4851dcd245afaf5e0d6439d8fa6d', digest
          assert len(patch) == 207502, len(patch)
          Path(os.environ['RUNNER_TEMP'], 'm2.patch').write_bytes(patch)
          Path(os.environ['RUNNER_TEMP'], 'transfer-sha256.txt').write_text(digest + '\n')
          print('Verified patch SHA-256:', digest)
          PY
          git read-tree --reset -u 91dbd31313922cdd98b89318dc4a077e73b802e2
          git apply --index "$RUNNER_TEMP/m2.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --check
          printf '%s\n' "$EXPECTED_TREE" > "$RUNNER_TEMP/tested-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/m2-tested-source.tar.gz" "$EXPECTED_TREE"
      - uses: actions/upload-artifact@v4
        with:
          name: m2-tested-source-${{ env.EXPECTED_TREE }}
          path: ${{ runner.temp }}/m2-tested-source.tar.gz
          retention-days: 3
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: Test exact source tree
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - name: Commit tested tree only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/m2-web-import
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --check
          git fetch origin refs/heads/codex/m2-web-import
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat: import web full projects with faithful migrations and atomic review'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:refs/heads/codex/m2-web-import
          git rev-parse HEAD > "$RUNNER_TEMP/delivered-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-delivery-results-${{ github.sha }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/app/*.png
            ${{ runner.temp }}/transfer-sha256.txt
            ${{ runner.temp }}/tested-tree.txt
            ${{ runner.temp }}/delivered-commit.txt
          if-no-files-found: warn
          retention-days: 7
