name: M5 validation
on:
  push:
    branches: [codex/m5-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel 2
      - name: Fetch pinned full hydro dataset
        id: real_hydro
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/world-map
          ref: c0bd31d13dc8495593d78cf51f7cc195de7c9469
          path: full-hydro-world-map
          persist-credentials: false
          sparse-checkout: |
            assets/data/hydro/v0.13.0
            assets/data/hydro/v0.13.1
      - name: Test complete suite
        env:
          PANDOEDITOR_HYDRO_FULL_MANIFEST: ${{ steps.real_hydro.outcome == 'success' && format('{0}/full-hydro-world-map/assets/data/hydro/v0.13.1/manifest.json', github.workspace) || '' }}
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-results-${{ github.sha }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/app/m5-label-*.png
          retention-days: 7
