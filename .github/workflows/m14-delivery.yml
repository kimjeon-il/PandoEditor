name: M1.4 exact-tree build and delivery
on:
  push:
    branches: [codex/m1-4-worker-sessions]
    paths: ['.delivery/**', '.github/workflows/m14-delivery.yml']
permissions:
  contents: read
concurrency:
  group: m14-delivery
  cancel-in-progress: true
jobs:
  deliver-tested-tree:
    if: github.repository == 'kimjeon-il/PandoEditor' && github.ref == 'refs/heads/codex/m1-4-worker-sessions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/m1-4-worker-sessions
      - name: Verify and stage exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bd8395657e6e4ab76e090044e7d6df9d56087e71 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          paths = sorted(pathlib.Path('.delivery').glob('m14-*.b64'))
          assert len(paths) == 4
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ecf7694cce8b0e01475850df5b2f75594ce93ecd65f7ccb3758674784583d183'
          pathlib.Path('/tmp/m14.patch').write_bytes(patch)
          PY
          git rm -r -- .delivery .github/workflows/m14-delivery.yml
          test "$(git write-tree)" = e79ecda8fafe1627a28a09bd1cbc1e5076fdd0a9
          git apply --index /tmp/m14.patch
          git diff --cached --check
          test "$(git write-tree)" = a022ad797e20f5c5b7a8e88684ce6b275b9b9b31
          git archive --format=tar.gz --output=${{ runner.temp }}/source.tar.gz "$(git write-tree)"
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree-a022ad797e20f5c5b7a8e88684ce6b275b9b9b31
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 3
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure and build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel 2 2>&1 | tee build/build.log
      - name: Test exact tree
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - name: Commit tested tree only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = a022ad797e20f5c5b7a8e88684ce6b275b9b9b31
          test "$(git ls-remote origin refs/heads/codex/m1-4-worker-sessions | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'PandoEditor validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement snapshot worker sessions and restore web field commits'
          git push origin HEAD:refs/heads/codex/m1-4-worker-sessions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-delivery-results-${{ github.sha }}
          path: |
            build/results.xml
            build/build.log
            build/Testing/Temporary/LastTest.log
            build/app/*.png
          if-no-files-found: ignore
          retention-days: 7
